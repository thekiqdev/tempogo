name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: cronocheckpoint
          POSTGRES_PASSWORD: ci_only_ephemeral
          POSTGRES_DB: cronocheckpoint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cronocheckpoint -d cronocheckpoint_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: PostgreSQL integration
        env:
          DATABASE_URL: postgresql://cronocheckpoint:ci_only_ephemeral@localhost:5432/cronocheckpoint
          TEST_DATABASE_URL: postgresql://cronocheckpoint:ci_only_ephemeral@localhost:5432/cronocheckpoint_test
        run: |
          touch .env
          npm run test:integration
