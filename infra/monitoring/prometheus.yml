global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: tempogo
    metrics_path: /api/v1/operations/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["PROJECT_api:3001"]
# Replace PROJECT_api with the actual private DNS.
# Configure Alertmanager and its receiver only after selecting the on-call team.
