# TempoGo: retain the existing project identity to reuse volumes and networks.
name: cronocheckpoint
services:
  database:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: cronocheckpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD em .env}
      POSTGRES_DB: cronocheckpoint
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronocheckpoint -d cronocheckpoint"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres-data:

